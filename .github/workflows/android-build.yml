name: Build ScanMate AI Pro APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK, Release APK, and Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PROJECT_DIR: ScanMate-AI-Pro-main-app
      GRADLE_VERSION: "8.9"
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Xmx4096m"
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: "1.4.${{ github.run_number }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate project structure
        run: |
          set -e
          echo "Repository root: $(pwd)"
          echo "Project directory: ${PROJECT_DIR}"
          test -d "${PROJECT_DIR}"
          test -f "${PROJECT_DIR}/settings.gradle.kts"
          test -f "${PROJECT_DIR}/build.gradle.kts"
          test -d "${PROJECT_DIR}/app"
          test -d "${PROJECT_DIR}/gradle"
          test -f "${PROJECT_DIR}/app/build.gradle.kts"
          test -f "${PROJECT_DIR}/gradle/libs.versions.toml"
          ls -la "${PROJECT_DIR}"

      # Uses a clean Gradle 8.9 distribution so CI does not fail if an uploaded wrapper jar is damaged.
      - name: Install clean Gradle 8.9
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          mkdir -p .gradle-ci
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o .gradle-ci/gradle.zip
          unzip -q .gradle-ci/gradle.zip -d .gradle-ci
          ".gradle-ci/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: .gradle-ci/gradle-${GRADLE_VERSION}/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: .gradle-ci/gradle-${GRADLE_VERSION}/bin/gradle assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: .gradle-ci/gradle-${GRADLE_VERSION}/bin/gradle bundleRelease --no-daemon --stacktrace

      - name: List generated outputs
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Generated APKs:"
          find app/build/outputs/apk -type f -name "*.apk" -print || true
          echo "Generated AABs:"
          find app/build/outputs/bundle -type f -name "*.aab" -print || true
          echo "Version: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanMate-AI-Pro-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanMate-AI-Pro-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ScanMate-AI-Pro-release-aab
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
